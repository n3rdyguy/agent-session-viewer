[project]
name = "agent-session-viewer"
version = "0.1.0"
description = "Local web UI for browsing, searching, and exporting Grok, Claude, and Codex agent sessions"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
]

[dependency-groups]
dev = [
    "pyright>=1.1.403",
    "pytest",
    "ruff>=0.12.7",
]

[project.scripts]
agent-session-viewer = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_session_viewer"]
only-include = ["agent_session_viewer", "app.py", "main.py", "templates", "static"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
include = [
    "agent_session_viewer/app.py",
    "agent_session_viewer/config.py",
    "agent_session_viewer/util.py",
]
pythonVersion = "3.14"
typeCheckingMode = "basic"
