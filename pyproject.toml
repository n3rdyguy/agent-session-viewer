[project]
name = "agent-session-viewer"
version = "0.3.0"
description = "Local web UI for browsing, searching, and exporting Grok, Claude, Codex, and Cursor agent sessions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1.3",
]

[dependency-groups]
dev = [
    "playwright>=1.54.0",
    "pyright>=1.1.403",
    "pytest",
    "ruff>=0.12.7",
]

[project.scripts]
agent-session-viewer = "agent_session_viewer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_session_viewer"]

[tool.hatch.build.targets.sdist]
include = [
    "agent_session_viewer/",
    "README.md",
    "CHANGELOG.md",
    "LICENSE*",
    "pyproject.toml",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "browser: Chromium browser security regression tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = [
    "agent_session_viewer/app.py",
    "agent_session_viewer/authorization.py",
    "agent_session_viewer/config.py",
    "agent_session_viewer/grouping.py",
    "agent_session_viewer/registry.py",
    "agent_session_viewer/util.py",
]
pythonVersion = "3.10"
typeCheckingMode = "basic"
