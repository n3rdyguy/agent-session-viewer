[project]
name = "agent-session-viewer"
version = "0.1.0"
description = "Local web UI for browsing, searching, and exporting Grok, Claude, and Codex agent sessions"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
]

[project.scripts]
agent-session-viewer = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["app.py", "main.py", "templates", "static"]

[tool.uv]
package = true
