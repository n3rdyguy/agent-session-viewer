<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ title }}{% endblock %} - Agent Session Viewer</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" sizes="any">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body class="preview-on file-reads-on">
  <header>
    <h1><a href="{{ url_for('index') }}">Agent Session Viewer</a></h1>
    <nav style="display:flex; gap:1.1rem;">
      <a href="{{ url_for('index') }}">All</a>
      <a href="{{ url_for('index', agent='grok') }}">Grok</a>
      <a href="{{ url_for('index', agent='claude') }}">Claude</a>
      <a href="{{ url_for('index', agent='codex') }}">Codex</a>
    </nav>
  </header>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
  <footer>Local only • Reads ~/.grok · ~/.claude · ~/.codex</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
