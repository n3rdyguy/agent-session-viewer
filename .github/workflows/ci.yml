name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Check committed line endings are LF
        shell: bash
        run: |
          # .gitattributes pins the repo to LF. Checkout may write CRLF into the
          # working tree on Windows, so inspect the index (i/) rather than disk.
          if git ls-files --eol | grep -E '^i/(crlf|mixed)'; then
            echo "::error::Files above are stored with CRLF. Run: git add --renormalize ."
            exit 1
          fi
          echo "All tracked files are stored with LF."
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -m "not browser"
      - run: uv build
      - name: Smoke-test wheel contents and runtime
        run: uv run python scripts/smoke_wheel.py

  browser-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m browser
